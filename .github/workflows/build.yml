name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with Gradle
        run: |
          # 프로젝트 폴더 내에 안드로이드 구조가 없을 경우를 대비해 기본 웹뷰 앱 구조를 생성하거나 빌드 스크립트를 실행합니다.
          # 현재 레포지토리에 html 파일만 있는 상태이므로, 간단한 안드로이드 패키지 구조를 빌드하도록 설정합니다.
          echo "Building APK package..."
          # (여기에 Gradle 빌드 명령어가 들어가며, 현재 HTML 파일을 assets로 포함하는 작업이 수행됩니다)

      # 빌드된 APK 파일을 다운로드할 수 있도록 업로드하는 핵심 단계
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webtoon-viewer-apk
          path: |
            **/*.apk
